[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writeo-mcp"
version = "0.1.0"
description = "Unofficial local MCP server for co-writing in your own Writeo account"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
writeo-mcp = "writeo_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
writeo_mcp = ["login.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
